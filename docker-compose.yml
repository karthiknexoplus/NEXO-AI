services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  nexoplus:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3080
      OLLAMA_HOST: http://ollama:11434
      WORKSPACE_ROOT: /app/workspace
      NEXO_MODEL: qwen2.5-coder
    ports:
      - "3080:3080"
    volumes:
      - nexo_workspace:/app/workspace
    depends_on:
      - ollama

volumes:
  ollama_data:
  nexo_workspace:
